<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GRVCE BARBER - Rendez-vous</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<canvas id="stars"></canvas>

<img src="planete.png" class="planet">
<img src="fusee.png" class="rocket">
<img src="satelite.png" class="satellite">
<img src="among us.png" class="amongus">

<nav class="navbar">
  <a class="logo" href="accueil.html">GRVCE BARBER</a>
</nav>

<main>

  <section class="hero hero-small">
    <h1 class="hero-title">Rendez-vous</h1>
    <p class="hero-subtitle">Réserve en 1 minute</p>
  </section>

  <!-- ⚠️ MESSAGE -->
  <section class="section">
    <h2 class="alert-text">
      ⚠️ Du lundi au vendredi +5€
    </h2>
  </section>

  <!-- PRIX -->
  <section class="section">
    <div class="price-grid">

      <div class="price-card" onclick="scrollToAgenda()">
        <span>Coupe</span>
        <strong>10€</strong>
      </div>

      <div class="price-card" onclick="scrollToAgenda()">
        <span>Contours</span>
        <strong>5€</strong>
      </div>

      <div class="price-card" onclick="scrollToAgenda()">
        <span>Coupe + barbe</span>
        <strong>15€</strong>
      </div>

      <div class="price-card" onclick="scrollToAgenda()">
        <span>Déplacement</span>
        <strong>+5€</strong>
      </div>

    </div>
  </section>

  <!-- AGENDA -->
  <section class="section agenda-section" id="agenda">
    <h2 class="section-title">Choisis ton créneau</h2>

    <div class="iframe-wrap">
      <iframe
        src="https://calendar.app.google/X7s5x1gVGDosjLzv7"
        frameborder="0"
        loading="lazy">
      </iframe>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-logo">GRVCE BARBER</div>
  </div>
</footer>

<script>
function scrollToAgenda(){
  document.getElementById("agenda").scrollIntoView({ behavior: "smooth" });
}
</script>

<script src="script.js"></script>
</body>
</html>
